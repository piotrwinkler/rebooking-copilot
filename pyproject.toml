[project]
name = "rebooking-copilot"
version = "0.1.0"
description = "POC for a flight reshopping recommendation agent."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[tool.poetry]
packages = [{ include = "rebooking_copilot" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
